name: Research release integrity

on:
  push:
    branches: [main]
    paths:
      - "records/2026-10-17-priority-zero-expanded/**"
      - ".github/workflows/research-release-checks.yml"
  pull_request:
    paths:
      - "records/2026-10-17-priority-zero-expanded/**"
      - ".github/workflows/research-release-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Release integrity on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: records/2026-10-17-priority-zero-expanded
    steps:
      - name: Check out the public selection
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Check release file and archive identities
        run: python -B verify_release.py
      - name: Exercise valid and tampered inputs
        run: python -B test_release_verifier.py
